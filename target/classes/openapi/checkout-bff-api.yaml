openapi: 3.0.3
info:
  title: Checkout BFF API
  description: API-First contract for the Subscription Checkout BFF.
  version: 1.0.0

tags:
  - name: Operations
    description: Pre-checkout and checkout orchestration endpoints

paths:
  /operations/pre-checkout:
    post:
      tags:
        - Operations
      summary: Initialize checkout cart
      operationId: createPreCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreCheckoutRequest'
      responses:
        '200':
          description: Cart assembled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreCheckoutResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '404':
          description: Product slug not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'

  /operations/checkout:
    post:
      tags:
        - Operations
      summary: Process checkout payment
      operationId: processCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Payment approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSuccessResponse'
        '400':
          description: Invalid payment data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '404':
          description: Cart ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '409':
          description: Cart already approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '422':
          description: Payment declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'

components:
  schemas:
    PreCheckoutRequest:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductSlugItem'

    ProductSlugItem:
      type: object
      required:
        - slug
      properties:
        slug:
          type: string
          example: premium

    PreCheckoutResponse:
      type: object
      required:
        - cartId
        - products
        - paymentMethods
      properties:
        cartId:
          type: string
          format: uuid
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDetail'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodOption'

    ProductDetail:
      type: object
      required:
        - slug
        - name
        - description
        - price
        - currency
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string

    PaymentMethodOption:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CheckoutRequest:
      type: object
      required:
        - cartId
        - paymentMethod
      properties:
        cartId:
          type: string
          format: uuid
        paymentMethod:
          $ref: '#/components/schemas/CheckoutPaymentMethodInput'

    CheckoutPaymentMethodInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        card:
          $ref: '#/components/schemas/CardInput'

    CardInput:
      type: object
      required:
        - holderName
        - number
        - expiry
        - cvv
      properties:
        holderName:
          type: string
        number:
          type: string
        expiry:
          type: string
        cvv:
          type: string

    CheckoutSuccessResponse:
      type: object
      required:
        - cartId
        - status
        - paidAt
        - payment
        - products
      properties:
        cartId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - APROVADO
        paidAt:
          type: string
          format: date-time
        payment:
          $ref: '#/components/schemas/PaymentReceipt'
        products:
          type: array
          items:
            $ref: '#/components/schemas/PurchasedProductSummary'

    PaymentReceipt:
      type: object
      required:
        - method
        - amount
        - currency
      properties:
        method:
          type: string
        lastDigits:
          type: string
        pixCode:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string

    PurchasedProductSummary:
      type: object
      required:
        - slug
        - name
        - price
      properties:
        slug:
          type: string
        name:
          type: string
        price:
          type: number
          format: double

    CheckoutErrorResponse:
      type: object
      required:
        - displayType
        - errorCode
        - frontendError
      properties:
        displayType:
          type: string
          enum:
            - BLOCK
            - INTERVENTION
        errorCode:
          type: string
        cartId:
          type: string
          format: uuid
          nullable: true
        frontendError:
          $ref: '#/components/schemas/FrontendError'

    FrontendError:
      type: object
      required:
        - code
        - title
        - description
        - primaryButton
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
        primaryButton:
          $ref: '#/components/schemas/ErrorActionButton'
        secondaryButton:
          $ref: '#/components/schemas/ErrorActionButton'

    ErrorActionButton:
      type: object
      required:
        - label
        - url
      properties:
        label:
          type: string
        url:
          type: string