spring:
  application:
    name: checkout-bff

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkout_db}
    username: ${DB_USER:checkout}
    password: ${DB_PASSWORD:checkout}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false

  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [corrId=%X{correlationId:-SYSTEM}] %logger{36} - %msg%n"
  level:
    com.dw.checkout: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

checkout:
  outbox:
    poll-interval-ms: ${CHECKOUT_OUTBOX_POLL_INTERVAL_MS:1000}
  payment-recovery:
    interval-ms: ${CHECKOUT_PAYMENT_RECOVERY_INTERVAL_MS:30000}
    timeout-ms: ${CHECKOUT_PAYMENT_RECOVERY_TIMEOUT_MS:120000}
