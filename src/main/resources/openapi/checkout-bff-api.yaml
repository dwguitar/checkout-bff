openapi: 3.0.3
info:
  title: Checkout BFF
  version: 0.1.0
  description: >
    BFF do fluxo de checkout de assinaturas. Entrega payloads enxutos para as
    telas de Pagamento, Sucesso e Erro. O número completo do cartão e o CVV
    nunca são persistidos nem devolvidos.

tags:
  - name: operations
    description: Operações de pré-checkout e checkout

paths:
  /operations/pre-checkout:
    post:
      tags: [operations]
      operationId: createPreCheckout
      summary: Cria o carrinho e devolve produtos e meios de pagamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreCheckoutRequest'
            example:
              - slug: premium
      responses:
        '200':
          description: Carrinho criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreCheckoutResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '422':
          description: Produto inexistente ou regra de negócio violada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'

  /operations/checkout:
    post:
      tags: [operations]
      operationId: processCheckout
      summary: Paga um carrinho previamente criado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              credito:
                summary: Cartão de crédito
                value:
                  cartId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  paymentMethod:
                    type: CREDIT_CARD
                    card:
                      holderName: Maria Silva
                      number: '4111111111111111'
                      expiration: '12/30'
                      cvv: '123'
              pix:
                summary: Pix
                value:
                  cartId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  paymentMethod:
                    type: PIX
      responses:
        '200':
          description: Pagamento aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '404':
          description: Carrinho inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '409':
          description: Carrinho já aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'
        '422':
          description: Pagamento recusado ou meio de pagamento inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutErrorResponse'

components:
  schemas:
    PreCheckoutRequest:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/ProductRef'

    ProductRef:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: premium

    PreCheckoutResponse:
      type: object
      required: [cartId, products, paymentMethods]
      properties:
        cartId:
          type: string
          format: uuid
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDetails'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodOption'

    ProductDetails:
      type: object
      required: [slug, name, amount, currency]
      properties:
        slug:
          type: string
          example: premium
        name:
          type: string
          example: Premium
        amount:
          type: number
          example: 39.90
        currency:
          type: string
          example: BRL

    PaymentMethodOption:
      type: object
      required: [type, label]
      properties:
        type:
          $ref: '#/components/schemas/PaymentType'
        label:
          type: string
          example: Cartão de Crédito

    PaymentType:
      type: string
      enum: [CREDIT_CARD, DEBIT_CARD, PIX]

    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [cartId, paymentMethod]
      properties:
        cartId:
          type: string
          format: uuid
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodInput'

    PaymentMethodInput:
      oneOf:
        - $ref: '#/components/schemas/CreditCardPaymentInput'
        - $ref: '#/components/schemas/DebitCardPaymentInput'
        - $ref: '#/components/schemas/PixPaymentInput'
      discriminator:
        propertyName: type
        mapping:
          CREDIT_CARD: '#/components/schemas/CreditCardPaymentInput'
          DEBIT_CARD: '#/components/schemas/DebitCardPaymentInput'
          PIX: '#/components/schemas/PixPaymentInput'

    CreditCardPaymentInput:
      type: object
      additionalProperties: false
      required: [type, card]
      properties:
        type:
          type: string
          pattern: '^CREDIT_CARD$'
          example: CREDIT_CARD
        card:
          $ref: '#/components/schemas/CardInput'

    DebitCardPaymentInput:
      type: object
      additionalProperties: false
      required: [type, card]
      properties:
        type:
          type: string
          pattern: '^DEBIT_CARD$'
          example: DEBIT_CARD
        card:
          $ref: '#/components/schemas/CardInput'

    PixPaymentInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          pattern: '^PIX$'
          example: PIX

    CardInput:
      type: object
      additionalProperties: false
      required: [holderName, number, expiration, cvv]
      properties:
        holderName:
          type: string
          minLength: 3
          maxLength: 80
          example: Maria Silva
        number:
          type: string
          description: PAN. Usado apenas em memória para autorizar; nunca é persistido nem logado.
          pattern: '^[0-9]{13,19}$'
          example: '4111111111111111'
        expiration:
          type: string
          description: Validade no formato MM/AA
          pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$'
          example: '12/30'
        cvv:
          type: string
          pattern: '^[0-9]{3,4}$'
          example: '123'

    CheckoutResponse:
      type: object
      required: [cartId, status, paidAt, payment, products]
      properties:
        cartId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APROVADO]
        paidAt:
          type: string
          format: date-time
        payment:
          $ref: '#/components/schemas/PaymentSummary'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'

    PaymentSummary:
      type: object
      required: [amount, currency]
      properties:
        lastDigits:
          type: string
          minLength: 4
          maxLength: 4
          description: Quatro últimos dígitos, presente quando o pagamento é cartão
          example: '1111'
        pixCode:
          type: string
          description: Código Pix simulado, presente quando o pagamento é Pix
        amount:
          type: number
          example: 39.90
        currency:
          type: string
          example: BRL

    ProductSummary:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string

    CheckoutErrorResponse:
      type: object
      required: [displayType, errorCode, frontendError]
      properties:
        displayType:
          $ref: '#/components/schemas/DisplayType'
        errorCode:
          type: string
          example: P-1001
        cartId:
          type: string
          format: uuid
        frontendError:
          $ref: '#/components/schemas/FrontendError'

    DisplayType:
      type: string
      enum: [BLOCK, INTERVENTION]

    FrontendError:
      type: object
      required: [code, title, description, primaryButton]
      properties:
        code:
          type: string
          example: P-1001
        title:
          type: string
        description:
          type: string
        primaryButton:
          $ref: '#/components/schemas/FrontendButton'
        secondaryButton:
          $ref: '#/components/schemas/FrontendButton'

    FrontendButton:
      type: object
      required: [label, action]
      properties:
        label:
          type: string
          example: Tentar novamente
        action:
          type: string
          enum: [GO_BACK, GO_HOME, RETRY, CHANGE_PAYMENT]
